<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منتدى الأسئلة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</div>
    <div class="sidebar" id="sidebar">
        <h3 style="margin-bottom: 20px; color: #6db672;">القائمة</h3>
        <a href="/myquestion">أسئلتي</a>
        <a href="#" onclick="localStorage.clear(); window.location.href='/login'">تسجيل خروج</a>
    </div>

    <div class="question-container">
        <div class="header-logo">
            <!-- يمكنك تغيير رابط الصورة ليكون اللوجو الخاص بك -->
            <img src="https://cdn-icons-png.flaticon.com/512/3022/3022378.png" alt="Microscope"> 
        </div>
        <div class="header-title">
            <h1>أهلاً في <span>منتدي الأسئلة</span></h1>
        </div>
        <div class="header-subtitle">لفيكتور بيولوجي</div>

        <div class="input-box">
            <textarea id="qText" placeholder="اكتب سؤال..."></textarea>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <label class="upload-btn">
                    📷 <span style="font-size: 10px;">+</span>
                    <input type="file" id="qFile" style="display: none;" accept="image/*">
                </label>
                <button class="submit-btn" id="submitBtn">إرسال 🚀</button>
            </div>
        </div>
        <p style="margin-top: 20px; color: #888;">اكتب سؤال وسيتم الرد عليك في اسرع وقت ⏱️</p>
    </div>
    
    <footer style="text-align: center; color: #555; padding: 20px;">
        Developed by=عمر اشرف السيد فرحات
    </footer>

    <script type="module">
        import { db, storage, push, ref, storageRef, uploadBytes, getDownloadURL, checkBanStatus } from './firebase-config.js';
        
        checkBanStatus();

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const text = document.getElementById('qText').value;
            const file = document.getElementById('qFile').files[0];
            const username = localStorage.getItem('username');

            if (!text && !file) return alert('اكتب سؤالاً أو ارفق صورة!');

            document.getElementById('submitBtn').innerText = 'جاري الإرسال...';
            let imageUrl = null;

            if (file) {
                const imgRef = storageRef(storage, `questions/${Date.now()}_${file.name}`);
                await uploadBytes(imgRef, file);
                imageUrl = await getDownloadURL(imgRef);
            }

            await push(ref(db, 'questions'), {
                username: username,
                text: text,
                imageUrl: imageUrl,
                timestamp: Date.now(),
                reply: "",
                replyImage: ""
            });

            document.getElementById('submitBtn').innerText = 'إرسال 🚀';
            document.getElementById('qText').value = '';
            alert('تم ارسال السوال بنجاح!');
        });
    </script>
</body>
</html>
