<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" style="text-align: center; margin-top: 150px; max-width: 400px;">
        <h2>تسجيل الدخول</h2>
        <br>
        <input type="text" id="usernameInput" placeholder="أدخل اسمك الكريم (ثلاثي أو رباعي)">
        <button onclick="login()" style="width: 100%; margin-top: 10px;">دخول</button>
    </div>

    <script>
        function login() {
            const name = document.getElementById('usernameInput').value.trim();
            if(name) {
                localStorage.setItem('username', name);
                window.location.href = '/question';
            } else {
                alert('يرجى كتابة الاسم!');
            }
        }
    </script>
</body>
</html>
