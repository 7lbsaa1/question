<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - منصة الأحياء</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style="justify-content: center; align-items: center;">
    
    <div class="glass-card" style="width: 100%; max-width: 400px; text-align: center;">
        <h2 style="color: var(--primary); margin-bottom: 5px;">أهلاً بك</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">من فضلك أدخل اسمك للمتابعة</p>
        
        <input type="text" id="usernameInput" placeholder="الاسم الثلاثي أو الرباعي..." autocomplete="off">
        <button class="btn" onclick="login()" style="width: 100%; margin-top: 20px;">دخول للمنصة</button>
    </div>

    <script type="module">
        import { enforceSecurity } from './firebase-config.js';
        enforceSecurity();

        window.login = () => {
            const name = document.getElementById('usernameInput').value.trim();
            if(name.length > 5) {
                localStorage.setItem('username', name);
                window.location.replace('/question');
            } else {
                alert('يرجى كتابة الاسم بشكل صحيح (أكثر من 5 أحرف)');
            }
        };
    </script>
</body>
</html>
