<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اطرح سؤالك</title>
    <link rel="stylesheet" href="/style.css">
    <!-- استخدام FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/question" class="logo"><i class="fa-solid fa-microscope"></i> فيكتور بيولوجي</a>
        <div class="nav-links">
            <a href="/question" class="active">اطرح سؤالاً</a>
            <a href="/myquestion">أسئلتي ومراجعاتي</a>
        </div>
    </nav>

    <div style="flex: 1; display: flex; justify-content: center; padding: 40px 20px;">
        <div class="glass-card" style="width: 100%; max-width: 700px;">
            <h2 style="margin-bottom: 10px;">ما هو سؤالك؟</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">اكتب سؤالك بالتفصيل أو أرفق صورة للسؤال، وسيتم الرد عليك في أقرب وقت.</p>
            
            <textarea id="qText" placeholder="اكتب تفاصيل سؤالك هنا..."></textarea>
            
            <!-- منطقة رفع الصورة الاحترافية -->
            <label class="upload-area" id="dropZone" style="margin-top: 15px;">
                <input type="file" id="qFile" style="display: none;" accept="image/*">
                <i class="fa-solid fa-cloud-arrow-up" id="uploadIcon"></i>
                <span id="uploadText">اضغط هنا لرفع صورة أو اسحب الصورة وأفلتها</span>
                <img id="imagePreview" class="image-preview">
            </label>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">بواسطة: <strong id="displayName" style="color:var(--text-main)"></strong></span>
                <button class="btn" id="submitBtn">
                    <i class="fa-solid fa-paper-plane"></i> إرسال السؤال
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, storage, push, ref, storageRef, uploadBytes, getDownloadURL, enforceSecurity } from './firebase-config.js';
        
        enforceSecurity();
        document.getElementById('displayName').innerText = localStorage.getItem('username');

        // سكربت معاينة الصورة الاحترافي
        const fileInput = document.getElementById('qFile');
        const preview = document.getElementById('imagePreview');
        const icon = document.getElementById('uploadIcon');
        const text = document.getElementById('uploadText');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    icon.style.display = 'none';
                    text.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // إرسال البيانات
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const qText = document.getElementById('qText').value.trim();
            const file = fileInput.files[0];
            const username = localStorage.getItem('username');
            const btn = document.getElementById('submitBtn');

            if (!qText && !file) {
                alert('عذراً، يجب كتابة سؤال أو إرفاق صورة.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الإرسال...';

            try {
                let imageUrl = null;
                if (file) {
                    // إنشاء اسم فريد للصورة لمنع التضارب
                    const imgRef = storageRef(storage, `questions/${Date.now()}_${Math.random().toString(36).substring(7)}_${file.name}`);
                    await uploadBytes(imgRef, file);
                    imageUrl = await getDownloadURL(imgRef);
                }

                await push(ref(db, 'questions'), {
                    username: username,
                    text: qText,
                    imageUrl: imageUrl,
                    timestamp: Date.now(),
                    reply: "",
                    replyImage: ""
                });

                alert('تم إرسال سؤالك بنجاح!');
                window.location.replace('/myquestion'); // تحويل مباشر لصفحة أسئلته
            } catch (error) {
                console.error("Error:", error);
                alert('حدث خطأ أثناء الإرسال، حاول مرة أخرى.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال السؤال';
            }
        });
    </script>
</body>
</html>
